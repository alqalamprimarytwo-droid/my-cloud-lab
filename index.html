<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cloud Lab</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            max-width: 650px;
            width: 100%;
            padding: 50px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: appear 1s ease;
        }

        .icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(30px, 6vw, 46px);
            margin-bottom: 18px;
        }

        h1 span {
            color: #38bdf8;
        }

        p {
            color: #dbeafe;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            background: #0ea5e9;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            background: white;
            color: #1e3a8a;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            background: #38bdf8;
            color: white;
            transform: translateY(-3px);
        }

        footer {
            margin-top: 35px;
            color: #bfdbfe;
            font-size: 13px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <main class="card">
        <div class="icon">☁️</div>

        <div class="badge">CLOUD COMPUTING LAB 1</div>

        <h1>Hello from the <span>Cloud!</span></h1>

        <p>
            Welcome to my first cloud-hosted website.
            This project demonstrates how web applications
            can be published and accessed through the internet.
        </p>

        <a class="button"
           href="https://github.com"
           target="_blank">
            Explore GitHub ↗
        </a>

        <footer>
            Built by Ahmed | Powered by GitHub Pages
            <br><br>
            © 2026 My Cloud Lab
        </footer>
    </main>

</body>
</html>
